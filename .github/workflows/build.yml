name: build
# Title the run by the TAG on a release (v1.0.48), else by the commit message. Without this, a tag pushed
# AFTER its commit is already on the branch carries no head_commit, so the run fell back to the workflow name
# ("build") instead of a versioned title.
run-name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.head_commit.message || github.workflow }}

# Compiles the 32-bit AioHud.dll on a Windows runner. On a `v*` tag it publishes a GitHub Release
# with the raw DLL (for the in-game auto-updater) + a full payload zip (for manual install).
on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create Releases on a tag push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # No MSVC-setup action needed: build.bat locates Visual Studio itself (vswhere) and sets up the x86 toolchain.
      # Version = the tag (without the leading v) on a release, else dev-<short sha>. Fed to build.bat via env.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="dev-${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "AIOHUD_VERSION=$V" >> "$GITHUB_ENV"

      # Cheap greps for the five conventions that have each already cost a user-visible bug. They read the
      # working tree, so they run before anything is compiled. Each `git grep` EXITS 0 when it finds something,
      # which is why the sense below looks inverted : a hit is a failure.
      #
      # SPLIT IN TWO, deliberately. Rule 10 is the one that produced six user-visible bugs in a single day, and
      # its check now sits at zero hits on a clean tree -- the only state in which enforcing a guard is worth
      # anything. It gets its own BLOCKING step precisely so the four advisory rules cannot hold it hostage:
      # while all five share a step with known hits, `continue-on-error` has to cover the lot, and a rule that
      # never blocks is a rule people stop reading. That is not hypothetical -- this guard already missed a real
      # `mmTried_` latch and nobody noticed, because its output was noise by default.
      #
      # Two filters keep rule 10 at zero on a clean tree. COMMENT lines are skipped: four files document this
      # very pattern in prose, and a guard that fires on the text explaining it punishes writing the explanation
      # down. And `rule10-ok: <reason>` on the line suppresses it, for the cases where a one-shot really is
      # right -- memoising something that CANNOT fail transiently (the DLL's own module path), or a budget whose
      # variable merely still carries the name `*Tried`. The marker must carry its reason, at the site.
      #
      # The `_?` in the pattern is load-bearing, not cosmetic. This project suffixes MEMBER variables with `_`,
      # so the latch this rule must catch most often is written `mmTried_ = true` -- and `[Tt]ried *= *true`
      # cannot match that: the underscore sits between the word and the `=`. Every latch carried by a class
      # member was invisible here. Measured 2026-07-26: the old regex found 6 hits (all plain locals), the same
      # regex with `_?` found 9 -- the three extra being config_page.cpp:1495/1517/1535, the one-shot
      # minimap-sample loader the audit had to find BY HAND while this guard stayed silent on it. The read side
      # (`if (!fooTried_)`) is matched too: a latch is a pair, catching either half stops it reaching main.
      - name: Guardrail (rule 10) -- BLOCKING
        shell: bash
        run: |
          hits="$(git grep -nE 'static bool +[A-Za-z_]*[Tt]ried|[A-Za-z_]*[Tt]ried_? *= *true|if *\( *! *[A-Za-z_]*[Tt]ried_? *\)' -- 'src/*' ':!src/ui/tex_retry.h' \
                  | grep -vE ':[0-9]+:[[:space:]]*(//|\*)' | grep -v 'rule10-ok' || true)"
          if [ -n "$hits" ]; then printf '%s\n' "$hits"
            echo "::error::one-shot 'tried' latch (rule 10) -- use the bounded retry in ui/tex_retry.h, or justify it inline with 'rule10-ok: <reason>'"
            exit 1; fi
          # THE OTHER SPELLINGS. The guard above is indexed on the word "tried" -- and this project also writes the
          # same one-shot shape as `done` and `loaded` (gfx/font.cpp, model/ui_config.cpp), which is how the audit
          # of 2026-08-06 could still point at latches AFTER this guard had already been widened once, for the `_`
          # suffix. A guard that recognises only one synonym is a guard you have to remember, i.e. not a guard.
          # Every current hit is a legitimate bounded retry or a plain data field and now carries an inline
          # `rule10-ok: <reason>`, so this starts at ZERO and goes straight to blocking, per the rule below.
          hits2="$(git grep -nE 'static bool +[A-Za-z_]*([Dd]one|[Ll]oaded)|[A-Za-z_]*([Dd]one|[Ll]oaded)_? *= *true' -- 'src/*' ':!src/ui/tex_retry.h' \
                   | grep -vE ':[0-9]+:[[:space:]]*(//|\*)' | grep -v 'rule10-ok' || true)"
          if [ -n "$hits2" ]; then printf '%s\n' "$hits2"
            echo "::error::possible one-shot latch spelled done/loaded (rule 10) -- bounded retry, or justify it inline with 'rule10-ok: <reason>'"
            exit 1; fi
          echo "rule 10 : clean (tried / done / loaded)"

      # The four ADVISORY rules. Each still has known hits in the tree, so this step reports without blocking.
      # Promote a rule into the blocking step above the moment its own hit count reaches zero -- one at a time,
      # never as a batch: the point is that a red guard always means something.
      - name: Guardrails (advisory)
        shell: bash
        run: |
          fail=0
          # Rule 6 -- widgets read the once-per-frame snapshot ; only the poller touches game memory.
          if git grep -nE '\b(read_[a-z_]+|zone_id) *\(' -- 'src/ui/*.cpp'; then
            echo "::error::game-memory read inside src/ui (rule 6) -- read it from the GameState snapshot"; fail=1; fi
          # Rule 9 -- every control passes CTRL_ID ; a hand-picked number silently shares a spring.
          if git grep -nE 'ease\( *[0-9]' -- 'src/*'; then
            echo "::error::hand-picked ease() uid (rule 9) -- use CTRL_ID / ctrl_uid_i"; fail=1; fi
          # windower::debug::log goes through wvsprintfA, which has NO floating point : a %f prints garbage.
          # It bites exactly where it hurts most -- a diagnostic probe, unreadable on the one capture that
          # mattered, which reads like the bug not reproducing. Format tenths/percentages with integer math.
          if git grep -nE 'debug::log\("[^"]*%[-0-9.+ ]*[fgeFGE][^a-zA-Z]' -- 'src/*' 'include/*'; then
            echo "::error::%f in a debug::log format -- wvsprintfA has no floating point, use integer math"; fail=1; fi
          # A generated header with no banner is one somebody will hand-edit.
          if git grep -L 'GENERATED' -- 'src/model/*_gen.h'; then
            echo "::error::generated header without a 'GENERATED' banner"; fail=1; fi
          exit $fail
        continue-on-error: true   # reporting only for now : the tree still has known hits (see docs/notes/audit-technique-2026-07-26.md)

      # Offline suite : the pure core only (layout parser, skillchain resolution, duration model). No device,
      # no game memory -- it needs nothing the runner does not already have, and takes about two seconds.
      # BLOCKING, unlike the greps above : it is green today, so a red one is a real regression.
      - name: Tests
        shell: cmd
        run: tests.bat

      # PARSE the two scripts we SHIP. Nothing else in this pipeline ever looks at them: tests.bat is C++ only,
      # the guardrails grep src/ and include/, package.bat is a robocopy, and verify_release.ps1 only does a
      # substring test on the updater's text. So an unbalanced brace in either file compiles nothing, breaks
      # nothing, and ships -- and then PowerShell fails at parse time on EVERY player's machine before executing
      # a single line: no done.txt, and the Update tab blames the addon. Two parsers, no execution.
      - name: Parse the shipped scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @('assets/aioupdate.ps1', 'scripts/verify_release.ps1')) {
            $err = $null
            [void][System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $f), [ref]$err)
            if ($err.Count) { $err | ForEach-Object { Write-Host "::error file=$f,line=$($_.Token.StartLine)::$($_.Message)" }; $bad = 1 }
            else { Write-Host "$f parses OK" }
          }
          # The Lua ADDON is deliberately NOT checked here: the runner has no Lua, and the structural
          # heuristic that would replace a real parser (counting block keywords against `end`) produces false
          # failures on perfectly good code -- a guard that cries wolf is worse than none. It is parsed for real
          # before release instead: `luac -p updater/aioupdate/aioupdate.lua` (see scripts/README.md), and
          # deploy.bat now installs it to addons\ so it is actually exercised in game.
          if ($bad) { exit 1 }

      # package.bat calls build.bat (compiles the x86 DLL) then assembles the shippable payload into dist\.
      - name: Build + package
        shell: cmd
        run: package.bat

      # Only build a payload zip on a release tag (it's attached to the Release below). Non-tag pushes just
      # compile to validate the build. (No upload-artifact step -> no third-party Node-20 action ; the
      # in-game updater pulls from Releases, not from CI artifacts.)
      # The .sha256 sidecar is what makes the in-game updater able to REFUSE a payload. Without it the updater
      # extracts whatever the download produced, straight over the Windower root, on trust alone -- and that is
      # the one code path in this project that runs downloaded content inside the game process.
      - name: Zip payload
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = "AioHud-${{ steps.ver.outputs.version }}.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() | Set-Content -NoNewline -Encoding ascii "$zip.sha256"
          Write-Host "sha256 $(Get-Content "$zip.sha256")  $zip"

      # VERIFY THE ZIP BEFORE PUBLISHING IT. verify_release.ps1 runs at the very end, AFTER `gh release create
      # --latest` -- so a payload it rejects is already online and already the one /releases/latest points at, and
      # every client that checks on load is offered it. Four of its six checks need only the local artefact, so
      # they belong here, in front of the door. The post-publication pass keeps the one check that genuinely
      # requires publication (does /releases/latest resolve to this tag).
      - name: Verify the payload before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $zip = "AioHud-${{ steps.ver.outputs.version }}.zip"
          $bad = 0
          # 1. the sidecar actually describes THIS zip (the updater refuses the payload on a mismatch, so a wrong
          #    sidecar is a release nobody can install)
          $want = (Get-Content -Raw "$zip.sha256").Trim().ToLower()
          $got  = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($want -ne $got) { Write-Host "::error::sha256 sidecar does not match the zip ($want vs $got)"; $bad = 1 }
          else { Write-Host "sha256 sidecar matches" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            # 2. the DLL is in there, at the path the updater looks for, and is not a stub
            $dll = $z.Entries | Where-Object { $_.FullName -eq 'plugins/AioHud.dll' }
            if (-not $dll) { Write-Host "::error::payload has no plugins/AioHud.dll"; $bad = 1 }
            elseif ($dll.Length -lt 100000) { Write-Host "::error::plugins/AioHud.dll is only $($dll.Length) bytes"; $bad = 1 }
            else { Write-Host "plugins/AioHud.dll present ($($dll.Length) bytes)" }
            # 3. the companion addon ships too -- without it nobody unloads the DLL and every update ends in
            #    'dll-locked', which reads to the player as a dual-box problem they do not have
            if (-not ($z.Entries | Where-Object { $_.FullName -eq 'addons/aioupdate/aioupdate.lua' })) {
              Write-Host "::error::payload has no addons/aioupdate/aioupdate.lua"; $bad = 1 }
            else { Write-Host "addons/aioupdate/aioupdate.lua present" }
            # 4. the updater we ship reads the sidecar from a FILE, not from a byte array. v1.0.71 nearly shipped
            #    the reverse, which would have made every update refuse itself.
            $e = $z.Entries | Where-Object { $_.FullName -eq 'plugins/AioHud/assets/aioupdate.ps1' }
            if (-not $e) { Write-Host "::error::payload has no plugins/AioHud/assets/aioupdate.ps1"; $bad = 1 }
            else {
              $sr = New-Object IO.StreamReader($e.Open()); $txt = $sr.ReadToEnd(); $sr.Close()
              if ($txt.Contains(').Content -replace')) { Write-Host "::error::the shipped updater reads the sidecar from .Content -- the byte-array bug is back"; $bad = 1 }
              else { Write-Host "shipped updater does not read the sidecar from .Content" }
            }
          } finally { $z.Dispose() }
          if ($bad) { exit 1 }

      # One user-facing asset : the payload zip (extract into the <Windower> ROOT -> plugins\AioHud... + addons\aioupdate\).
      # The in-game updater downloads this same zip and extracts it over the Windower root (keeping AioHud\data\).
      # Published with the official `gh` CLI (pre-installed on the runner, a native binary) instead of a third-party
      # Node action -- the Node-20->24 runner migration broke softprops/action-gh-release@v2's HTTP client (it got
      # GitHub's HTML 404 page instead of JSON : "HttpError: <!DOCTYPE html>").
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"; V="${TAG#v}"
          # The in-game Update tab reads RELEASES[] in src/ui/config_changelog.h. Nothing linked it to the tag,
          # so a version could ship with no changelog entry at all -- the tab would show the installed build and
          # list nothing for it. Refuse the release instead of publishing a silent one.
          grep -q "{ \"$V\", CL_" src/ui/config_changelog.h \
            || { echo "::error::tag $TAG has no RELEASES[] entry in src/ui/config_changelog.h"; exit 1; }
          TOP="$(grep -oE '\{ "[0-9]+\.[0-9]+\.[0-9]+", CL_' src/ui/config_changelog.h | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          [ "$TOP" = "$V" ] \
            || { echo "::error::RELEASES[0] is $TOP, not $V -- the newest release must come first"; exit 1; }
          # The .sha256 sidecar is now LOAD-BEARING, not a nicety. From v1.0.71 the in-game updater fails CLOSED
          # when a release has no checksum -- so a release published without one cannot be installed by anybody,
          # and it surfaces to the player as "the updater is broken". Refuse to publish rather than ship that.
          # This bites hardest on a RE-release (delete the release, re-run the workflow) : both assets must go up.
          ls AioHud-*.zip >/dev/null 2>&1 \
            || { echo "::error::no payload zip to publish"; exit 1; }
          ls AioHud-*.zip.sha256 >/dev/null 2>&1 \
            || { echo "::error::payload has no .sha256 sidecar -- every client on v1.0.71+ would refuse this release"; exit 1; }
          # --latest is NOT the default : GitHub marks whichever release was PUBLISHED last, which is publish
          # time, not semver. v1.0.61 published 24 s after v1.0.62 once, and the updater queries /releases/latest.
          gh release create "$TAG" AioHud-*.zip AioHud-*.zip.sha256 --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --latest

      # VERIFY WHAT WAS ACTUALLY PUBLISHED, from the outside, the way a player's updater sees it. Everything
      # above this point checks inputs -- this is the only step that checks the artifact people will install.
      # It exists because v1.0.71 shipped an integrity check that could never pass: the comparison read
      # (Invoke-WebRequest).Content, a BYTE ARRAY on PS 5.1 for octet-stream responses, so it compared the ASCII
      # codes of the hex digits against the digest and every future update would have been refused. Reviewed,
      # syntax-checked, and exercised on a local file -- none of which could see it, because the defect lived in
      # what GitHub hands back over the wire. Only the real artifact could reveal it.
      # A red job here means the release is not installable, which is worth knowing now rather than at everyone's
      # next update. The script needs no token: the release API is public.
      - name: Verify published release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        # github.ref_name IS the tag on a tag push -- `${GITHUB_REF#refs/tags/}` is bash and expands to nothing
        # under pwsh, which would have silently verified /releases/latest instead of the tag just published.
        run: ./scripts/verify_release.ps1 -Repo "${{ github.repository }}" -Tag "${{ github.ref_name }}"
